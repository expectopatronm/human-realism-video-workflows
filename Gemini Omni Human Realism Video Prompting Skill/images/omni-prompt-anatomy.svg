<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of a Gemini Omni prompt</title>
  <desc id="description">Five layers from a validated scene plan: references, shot, action, physical behavior, and preservation constraints.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1432"/>
      <stop offset="1" stop-color="#192b55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="0.5" stop-color="#a496ff"/>
      <stop offset="1" stop-color="#f9b9d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="530" rx="28" fill="url(#background)"/>
  <rect x="42" y="40" width="7" height="54" rx="3" fill="url(#accent)"/>
  <text x="68" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Anatomy of an Omni prompt</text>
  <text x="68" y="91" fill="#bfcae5" font-family="Arial, sans-serif" font-size="16">Illustrative wording compiled from a validated human realism scene specification</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="118" width="1116" height="64" rx="12" fill="#24385d"/>
    <rect x="42" y="118" width="7" height="64" rx="3" fill="#5aa8ff"/>
    <text x="68" y="157" fill="#9dccff" font-size="18" font-weight="700">01  REFERENCES</text>
    <text x="316" y="157" fill="#fff" font-size="18">Use attached R1 for identity; R2 for the same person’s side proportions.</text>

    <rect x="42" y="190" width="1116" height="64" rx="12" fill="#24385d"/>
    <rect x="42" y="190" width="7" height="64" rx="3" fill="#80a5ff"/>
    <text x="68" y="229" fill="#b6c3ff" font-size="18" font-weight="700">02  SHOT</text>
    <text x="316" y="229" fill="#fff" font-size="18">One continuous, locked-off shot beside the table.</text>

    <rect x="42" y="262" width="1116" height="64" rx="12" fill="#24385d"/>
    <rect x="42" y="262" width="7" height="64" rx="3" fill="#a496ff"/>
    <text x="68" y="301" fill="#c8bcff" font-size="18" font-weight="700">03  ACTION</text>
    <text x="316" y="301" fill="#fff" font-size="18">Stand → reach → make contact → grip → lift → hold.</text>

    <rect x="42" y="334" width="1116" height="64" rx="12" fill="#24385d"/>
    <rect x="42" y="334" width="7" height="64" rx="3" fill="#d3a3ef"/>
    <text x="68" y="373" fill="#edc2ee" font-size="18" font-weight="700">04  REALISM</text>
    <text x="316" y="373" fill="#fff" font-size="18">Keep feet planted; coordinate the arm; move the mug only after grip.</text>

    <rect x="42" y="406" width="1116" height="64" rx="12" fill="#24385d"/>
    <rect x="42" y="406" width="7" height="64" rx="3" fill="#f9b9d0"/>
    <text x="68" y="445" fill="#ffd1df" font-size="18" font-weight="700">05  PRESERVE</text>
    <text x="316" y="445" fill="#fff" font-size="18">Keep her appearance and the mug shape stable; prevent sliding or clipping.</text>
  </g>
  <text x="43" y="504" fill="#a8b9d9" font-family="Arial, sans-serif" font-size="14">The reference IDs and wording here are illustrative. The actual prompt follows its own validated JSON and attachment order.</text>
</svg>
